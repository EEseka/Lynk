name: KMP Android Pipeline

# THE TRIGGER
on:
  push:
    branches: [ "**" ] # Runs on every single push to any branch
  pull_request:
    branches: [ "main" ] # Runs when I try to merge into main

# A new push to the same branch makes the older run pointless
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# THE ENVIRONMENT
jobs:
  build:
    name: Test and Build Android
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      MAP_TILER_API_KEY: ${{ secrets.MAP_TILER_API_KEY }}
      GOOGLE_PLACES_ANDROID_API_KEY: ${{ secrets.GOOGLE_PLACES_ANDROID_API_KEY }}
      GOOGLE_PLACES_IOS_API_KEY: ${{ secrets.GOOGLE_PLACES_IOS_API_KEY }}

    # THE INSTRUCTIONS
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > androidApp/google-services.json

      - name: Run Unit Tests
        run: ./gradlew testAndroidHostTest

      - name: Compile and Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-report
          path: "**/build/reports/tests/**"
          retention-days: 7

      - name: Upload APK for Testing
        uses: actions/upload-artifact@v6
        with:
          name: lynk-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
