name: KMP Release Pipeline

# Runs only when a version tag like v1.0.0 is pushed, and publishes the signed APK
# as a GitHub Release. The website's Download button points at its lynk.apk.
on:
  push:
    tags: [ "v*" ]

# Creating a release needs write access to the repository contents
permissions:
  contents: write

jobs:
  release:
    name: Build and Publish the Android Release
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
      MAP_TILER_API_KEY: ${{ secrets.MAP_TILER_API_KEY }}
      GOOGLE_PLACES_ANDROID_API_KEY: ${{ secrets.GOOGLE_PLACES_ANDROID_API_KEY }}
      GOOGLE_PLACES_IOS_API_KEY: ${{ secrets.GOOGLE_PLACES_IOS_API_KEY }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > androidApp/google-services.json

      # The keystore is stored as base64 text; turn it back into a file and tell Gradle where it is
      - name: Decode the release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lynk-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/lynk-release.jks" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: ./gradlew testAndroidHostTest

      - name: Build the Signed Release APK
        run: ./gradlew :androidApp:assembleRelease

      # The website links to releases/latest/download/lynk.apk, so the name must never change
      - name: Rename the APK to lynk.apk
        run: cp androidApp/build/outputs/apk/release/androidApp-release.apk lynk.apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lynk.apk --title "Lynk $GITHUB_REF_NAME" --generate-notes
